apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpm-pert
  labels:
    app: cpm-pert
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cpm-pert
  template:
    metadata:
      labels:
        app: cpm-pert
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cpm-pert
          image: cpm-pert-demo:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
