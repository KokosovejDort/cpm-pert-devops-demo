name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build image and run end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag cpm-pert-demo:ci .

      - name: Start container
        run: docker run --detach --name cpm-pert --publish 5000:5000 cpm-pert-demo:ci

      - name: Wait for the health endpoint
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5000/api/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "Application did not become healthy" >&2
          docker logs cpm-pert
          exit 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run end-to-end tests against the container
        run: pytest app/tests -q

      - name: Show container logs on failure
        if: failure()
        run: docker logs cpm-pert

  publish:
    name: Push image to GitHub Container Registry
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push
        run: |
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${IMAGE}:${GITHUB_SHA}" \
            --tag "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

  deploy-kind:
    name: Deploy to a temporary kind cluster
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Pull the image that was just published
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker tag "${IMAGE}:${GITHUB_SHA}" cpm-pert-demo:local

      - name: Install kind and kubectl
        run: |
          curl -fsSLo /tmp/kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          if ! command -v kubectl > /dev/null; then
            curl -fsSLo /tmp/kubectl "https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          fi
          kind version
          kubectl version --client

      - name: Create cluster
        run: kind create cluster --name cpm-pert --config kind/kind-config.yaml --wait 120s

      - name: Load image into the cluster
        run: kind load docker-image cpm-pert-demo:local --name cpm-pert

      - name: Deploy
        run: |
          kubectl apply -f k8s/
          kubectl rollout status deployment/cpm-pert --timeout=120s
          kubectl get pods,svc -o wide

      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/health
          echo
          curl -fsS -X POST http://127.0.0.1:8080/api/analyze \
            -H 'Content-Type: application/json' \
            -d '{"mode":"cpm","tasks":[{"id":"A","name":"Design","duration":3,"dependencies":[]},{"id":"B","name":"Build","duration":5,"dependencies":["A"]}]}' \
            | jq -e '.ok == true and .result.aon.project_duration == 8'

      - name: Cluster diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs -l app=cpm-pert --tail=100 || true
